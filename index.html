<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>思维导图</title>
<style>
:root{--ink:#1f3a9e;--paper:#fbf8ec}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:20px/1.5 KaiTi,STKaiti,"楷体","Noto Serif SC",serif;-webkit-user-select:none;user-select:none}
#stage{position:absolute;inset:0 0 calc(56px + env(safe-area-inset-bottom)) 0;overflow:hidden;touch-action:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;padding:64px 40px 40px;width:max-content;font-size:var(--fs,20px)}
.n{display:flex;align-items:flex-start}
.lab{display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;white-space:pre-wrap;max-width:420px;min-height:34px;border:1.5px solid transparent}
.m1>.lab{background:#fde0e0;box-shadow:inset 4px 0 0 #d33}
.m2>.lab{background:#ffe8c7;box-shadow:inset 4px 0 0 #e08a00}
.m3>.lab{background:#dcf2e0;box-shadow:inset 4px 0 0 #2e9e4f}
.m4>.lab{background:#eadcf7;box-shadow:inset 4px 0 0 #7a3fb5}
.sel>.lab{background:#dbe4ff;border-color:var(--ink)}
.hit>.lab{background:#fff0a0}
.now>.lab{outline:3px solid #d33;outline-offset:1px}
.kids{display:flex;flex-direction:column;gap:6px;margin-left:var(--gap,10px);padding-left:var(--gap,10px)}
.kids>.n{position:relative}
.kids>.n::before{content:"";position:absolute;left:calc(-1*var(--gap,10px));top:0;bottom:-6px;width:2px;background:var(--ink)}
.kids>.n:first-child::before{top:16px}
.kids>.n:last-child::before{bottom:auto;height:18px}
.kids>.n:first-child:last-child::before{display:none}
.dim>.lab{opacity:.3}
.dot{font-style:normal;font-size:14px;min-width:24px;height:24px;line-height:21px;text-align:center;border:1.5px solid var(--ink);border-radius:12px;flex:none}
.lab.hide{color:transparent;background:#d9d4bf}
.d-in{background:#ffe9a8!important}.d-up{border-top-color:#d33!important}.d-dn{border-bottom-color:#d33!important}
#ghost{position:fixed;pointer-events:none;background:#dbe4ff;border:1.5px solid var(--ink);border-radius:6px;padding:2px 8px;opacity:.85;z-index:9}
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom));padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;overflow-x:auto;background:#f1ecd6;border-top:1px solid #cfc8a8}
#bar button{flex:none;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);background:#fffdf3;border:1.5px solid var(--ink);border-radius:8px}
#bar button:active{background:#dbe4ff}
#dlg{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:40}
#dlg[hidden]{display:none}
#dlg>div{background:var(--paper);padding:14px;border-radius:12px;width:min(520px,92vw);display:flex;flex-direction:column;gap:10px}
#dlg .r{display:flex;gap:8px;justify-content:flex-end}
#dlg button{font:inherit;font-size:16px;padding:6px 18px;color:var(--ink);background:#fffdf3;border:1.5px solid var(--ink);border-radius:8px}
textarea{font:inherit;color:var(--ink);height:140px;border:1.5px solid var(--ink);border-radius:8px;padding:8px;background:#fff;-webkit-user-select:text;user-select:text}
#tl{position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top));display:flex;gap:8px;z-index:5}
#sv{position:fixed;right:8px;top:calc(8px + env(safe-area-inset-top));z-index:5;width:40px;height:40px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink);background:#fffdf3;border:1.5px solid var(--ink);border-radius:10px}
#sv.on::after,#sv.warn::after{content:"";position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:4px;background:#2e9e4f}
#sv.warn::after{background:#e08a00}
#sw{position:fixed;left:104px;right:56px;top:calc(8px + env(safe-area-inset-top));height:40px;z-index:5}
#sw input{width:100%;height:100%;font:inherit;font-size:16px;color:var(--ink);background:#fffdf3;border:1.5px solid var(--ink);border-radius:10px;padding:0 76px 0 10px;outline:none;-webkit-user-select:text;user-select:text}
#qc{position:absolute;right:34px;top:0;height:100%;padding:0 4px;display:flex;align-items:center;font-size:13px;opacity:.75}
#qx{position:absolute;right:0;top:0;width:34px;height:100%;display:none;align-items:center;justify-content:center;font-weight:normal;font-size:20px}
#pal{position:fixed;left:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:15;display:flex;gap:10px;padding:10px;background:var(--paper);border:1.5px solid var(--ink);border-radius:12px}
#pal[hidden]{display:none}
#pal button{width:40px;height:40px;border-radius:20px;border:2px solid var(--ink);font:inherit;font-size:18px;padding:0;color:var(--ink);background:#fffdf3}
#cfg{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:45}
#cfg[hidden]{display:none}
#cfg>div{background:var(--paper);padding:14px;border-radius:12px;width:min(420px,92vw);max-height:80vh;display:flex;flex-direction:column;gap:10px}
#cfg h3{margin:0;font-size:18px;font-weight:normal}
#cl{overflow:auto;flex:1}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #e6e0c6}
.row span{flex:1}
.row input{width:20px;height:20px;accent-color:var(--ink)}
#cfg button{font:inherit;font-size:16px;padding:4px 14px;color:var(--ink);background:#fffdf3;border:1.5px solid var(--ink);border-radius:8px}
#cfg .r{display:flex;gap:8px;justify-content:flex-end}
#nt{position:fixed;inset:0;z-index:42;background:var(--paper)}
#nt[hidden]{display:none}
.np{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.nh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nh b{font-weight:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np button{font:inherit;font-size:16px;padding:8px 16px;color:var(--ink);background:#fffdf3;border:1.5px solid var(--ink);border-radius:8px;flex:none}
#ntxt{height:auto;min-height:120px;max-height:38vh;resize:none;flex:none}
#ntg{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;align-content:start}
#ntg img{width:100%;aspect-ratio:1;object-fit:cover;border:1.5px solid var(--ink);border-radius:8px;background:#fffdf3}
#ask{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:46}
#ask[hidden]{display:none}
#ask>div{background:var(--paper);padding:16px;border-radius:12px;width:min(420px,92vw);display:flex;flex-direction:column;gap:10px}
#ask p{margin:0}#ask small{opacity:.65;font-size:14px;line-height:1.4}
#ask button{font:inherit;font-size:16px;padding:10px;color:var(--ink);background:#fffdf3;border:1.5px solid var(--ink);border-radius:8px}
#vw{position:fixed;inset:0;z-index:48;background:#000;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
#vw[hidden]{display:none}
#vi{max-width:100%;max-height:100%;transform-origin:center;-webkit-user-drag:none;pointer-events:none}
.vb{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}
.vb button{pointer-events:auto;font:inherit;font-size:16px;padding:8px 16px;border-radius:10px;border:1.5px solid #fff8;background:#0008;color:#fff}
#vd{color:#ff9a94!important}
.nt{font-style:normal;font-size:15px;flex:none;padding:2px 6px;margin:-2px 0;opacity:.85}
body.lock #bar,body.lock #tl,body.lock #sw,body.lock #sv{pointer-events:none;opacity:.5}
#fl{position:fixed;z-index:36;width:clamp(300px,48vw,720px);height:clamp(280px,56vh,560px);display:flex;flex-direction:column;background:var(--paper);border:1.5px solid var(--ink);border-radius:12px;box-shadow:0 6px 24px #0005;overflow:hidden}
#fl[hidden]{display:none}
#flh{flex:none;height:42px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 0 12px;background:#f1ecd6;border-bottom:1px solid #cfc8a8;touch-action:none;cursor:grab}
#flh b{font-weight:normal;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
#flx{flex:none;width:34px;height:34px;padding:0;font:inherit;font-size:24px;line-height:1;color:var(--ink);background:#fffdf3;border:1.5px solid var(--ink);border-radius:8px}
#fltx{flex:0 0 38%;overflow-y:auto;padding:10px 14px;font-size:18px;line-height:1.6;white-space:pre-wrap;touch-action:pan-y;-webkit-user-select:text;user-select:text;border-bottom:1px solid #cfc8a8}
#flim{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;background:#fffdf3}
#fli{max-width:100%;max-height:100%;transform-origin:center;pointer-events:none;-webkit-user-drag:none}
#flim button{position:absolute;top:50%;margin-top:-20px;width:40px;height:40px;padding:0;font:inherit;font-size:26px;line-height:1;color:var(--ink);background:#fffdf3cc;border:1.5px solid var(--ink);border-radius:20px}
#flp{left:6px}#fln{right:6px}
#flc{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:14px;padding:1px 10px;border-radius:10px;background:#fffdf3cc;pointer-events:none}
#toast{position:fixed;right:8px;top:calc(56px + env(safe-area-inset-top));z-index:50;max-width:70vw;padding:6px 12px;font-size:15px;background:var(--ink);color:#fff;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#tl button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font:inherit;font-size:26px;line-height:1;padding:0;color:var(--ink);background:#fffdf3;border:1.5px solid var(--ink);border-radius:10px}
.scrim{position:fixed;inset:0;background:#0004;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
#scrim{z-index:20}#scrim2{z-index:30}
#drawer{position:fixed;left:0;top:0;bottom:0;width:min(300px,82vw);z-index:21;background:var(--paper);border-right:1.5px solid var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);transform:translateX(-102%);transition:transform .22s}
#drawer.on{transform:none}
#drawer h2{margin:0;padding:14px 16px;font-size:18px;font-weight:normal;border-bottom:1px solid #cfc8a8}
#list{flex:1;overflow:auto}
.it{padding:12px 16px;border-bottom:1px solid #e6e0c6;display:flex;justify-content:space-between;gap:8px;-webkit-touch-callout:none}
.it.cur{background:#dbe4ff}
.it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{opacity:.6;flex:none;font-size:14px}
#hint{margin:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));font-size:14px;opacity:.6}
#sheet{position:fixed;left:0;right:0;bottom:0;height:50vh;z-index:31;background:var(--paper);border-top:1.5px solid var(--ink);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;transform:translateY(105%);transition:transform .22s}
#sheet.on{transform:none}
#stt{opacity:.7;padding:2px 4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheet button{font:inherit;font-size:18px;padding:14px;text-align:left;color:var(--ink);background:#fffdf3;border:1.5px solid var(--ink);border-radius:10px}
#rm{color:#b3261e!important;border-color:#b3261e!important}
</style></head><body>
<div id="stage"><div id="world"></div></div>
<div id="tl"><button id="menu" aria-label="历史导图"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><button id="new" aria-label="新建导图">＋</button></div>
<button id="sv" aria-label="保存"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg></button><div id="toast"></div>
<div class="scrim" id="scrim"></div>
<div id="drawer"><h2>历史导图</h2><div id="list"></div><p id="hint">点击切换，长按可重命名或删除</p></div>
<div class="scrim" id="scrim2"></div>
<div id="sheet"><div id="stt"></div><button id="rn">重命名</button><button id="rm">删除</button></div>
<div id="bar"></div>
<div id="sw"><input id="q" type="text" enterkeyhint="search" placeholder="搜索" autocomplete="off"><span id="qc"></span><b id="qx">×</b></div>
<div id="pal" hidden></div>
<div id="cfg" hidden><div><h3>自定义工具栏</h3><div id="cl"></div><div class="r"><button id="cfgreset">恢复默认</button><button id="cfgdone">完成</button></div></div></div>
<div id="dlg" hidden><div><textarea></textarea><div class="r"><button id="no">取消</button><button id="ok">确定</button></div></div></div>
<input type="file" id="file" accept=".json" hidden>
<input type="file" id="ntf" accept="image/*" multiple hidden>
<div id="nt" hidden><div class="np"><div class="nh"><b id="nttl"></b><button id="ntx">完成</button></div>
<textarea id="ntxt" placeholder="备注…"></textarea>
<button id="ntadd">＋ 添加图片（也可粘贴）</button><div id="ntg"></div></div></div>
<div id="ask" hidden><div><p id="askt"></p><small>压缩：最长边缩到 1600px，通常每张 100~300KB。<br>保留原图：占用空间大，图多时保存和导出会变慢。</small><button id="aky">压缩（推荐）</button><button id="akn">保留原图</button><button id="akc">取消</button></div></div>
<div id="fl" hidden><div id="flh"><b id="flt"></b><button id="flx" aria-label="关闭">×</button></div><div id="fltx"></div><div id="flim"><img id="fli"><button id="flp">‹</button><button id="fln">›</button><span id="flc"></span></div></div>
<div id="vw" hidden><img id="vi"><div class="vb"><button id="vc">关闭</button><button id="vd">删除</button></div></div>
<script>
const $=s=>document.querySelector(s),W=$('#world'),S=$('#stage'),D=$('#dlg'),K='mm2';
let uid=0;const nid=()=>'n'+Date.now().toString(36)+(uid++);
const T=(t,...k)=>({id:nid(),t,k,c:false});
let sel=null,mask=false,rev=new Set(),hist=[],redo=[],V={x:10,y:10,k:1},hitSet=new Set(),forced=new Set(),nowId=null,hits=[],hi=-1;
const mk=n=>({id:nid(),ts:Date.now(),root:T(n)});
let DB=null;try{DB=JSON.parse(localStorage.getItem(K))}catch(e){}
const DBOK=!!(DB&&DB.maps&&DB.maps.length);
if(!DBOK){let r0=null;try{r0=JSON.parse(localStorage.getItem('mm1'))}catch(e){}
 const m={id:nid(),ts:Date.now(),root:r0&&r0.k?r0:T('肩胛区',T('肌肉',T('冈上'),T('冈下'),T('小圆'),T('大圆')),T('三边孔'),T('四边孔'),T('肌腱袖',T('组成'),T('意义')))};DB={cur:m.id,maps:[m]}}
let cm=DB.maps.find(x=>x.id===DB.cur)||DB.maps[0],root=cm.root;DB.cur=cm.id;
let FH=null,wt=0,tt=0;
const save=()=>{cm.root=root;cm.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){}
 if(FH){clearTimeout(wt);wt=setTimeout(()=>flush(false).then(stat),500)}};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000)}
function stat(ok){const b=document.getElementById('sv');b.classList.toggle('on',!!FH&&ok!==false);b.classList.toggle('warn',!!FH&&ok===false)}
function idb(m,v){return new Promise((res,rej)=>{const r=indexedDB.open('mmfs',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onerror=()=>rej(r.error);
 r.onsuccess=()=>{const s=r.result.transaction('h',m==='get'?'readonly':'readwrite').objectStore('h'),q=m==='get'?s.get('fh'):s.put(v,'fh');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}})}
let busy=false,again=false;
async function flush(ask){if(!FH)return false;if(busy){again=true;return true}busy=true;
 try{let p=await FH.queryPermission({mode:'readwrite'});
  if(p!=='granted'){if(!ask)return false;p=await FH.requestPermission({mode:'readwrite'});if(p!=='granted')return false}
  const dat=JSON.stringify(await pack(DB.maps,DB.cur)),w=await FH.createWritable();await w.write(dat);await w.close();return true}
 catch(e){return false}
 finally{busy=false;if(again){again=false;flush(false).then(stat)}}}
async function pickFile(){
 if(!window.showSaveFilePicker){toast('此浏览器不支持自动写入');return false}
 try{FH=await showSaveFilePicker({suggestedName:'思维导图.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});
  try{await idb('put',FH)}catch(e){}return true}catch(e){return false}}
async function manualSave(){
 if(!FH&&!await pickFile()){if(!window.showSaveFilePicker){A.export();toast('已下载文件')}return}
 const ok=await flush(true);stat(ok);toast(ok?'已保存到 '+FH.name:'保存失败，请重试')}
(async()=>{try{FH=await idb('get');if(FH){stat((await FH.queryPermission({mode:'readwrite'}))==='granted')}}catch(e){FH=null}})();
const nm=m=>(m.root.t||'').split('\n')[0].trim()||'未命名';
let FS=20;try{FS=+localStorage.getItem('mm1fs')||20}catch(e){}
const setFS=d=>{FS=Math.min(40,Math.max(12,FS+d));W.style.setProperty('--fs',FS+'px');try{localStorage.setItem('mm1fs',FS)}catch(e){}};setFS(0);
let GP=10;try{GP=+localStorage.getItem('mm1gap')||10}catch(e){}
const setGP=d=>{GP=Math.min(60,Math.max(2,GP+d));W.style.setProperty('--gap',GP+'px');try{localStorage.setItem('mm1gap',GP)}catch(e){}};setGP(0);
function find(id,n=root,p=null,i=0){if(n.id===id)return{n,p,i};for(let j=0;j<n.k.length;j++){const r=find(id,n.k[j],n,j);if(r)return r}return null}
const sub=(n,id)=>n.id===id||n.k.some(c=>sub(c,id));
const cnt=n=>n.k.reduce((a,c)=>a+1+cnt(c),0);
function mut(f){hist.push(JSON.stringify(root));if(hist.length>100)hist.shift();redo=[];f();save();render()}
function relset(){const s=new Set();if(!sel)return s;const all=n=>{s.add(n.id);n.k.forEach(all)};const path=(n,a)=>{if(n.id===sel){a.forEach(x=>s.add(x.id));all(n);return true}return n.k.some(c=>path(c,a.concat(n)))};path(root,[]);return s}
function build(n,rel){
 const e=document.createElement('div');e.className='n'+(n.id===sel?' sel':'')+(rel&&!rel.has(n.id)?' dim':'')+(n.m?' m'+n.m:'')+(hitSet.has(n.id)?' hit':'')+(n.id===nowId?' now':'');e.dataset.id=n.id;
 const l=document.createElement('div'),leaf=!n.k.length,col=n.c&&!forced.has(n.id);
 l.className='lab'+(leaf?' leaf':'')+(mask&&leaf&&!rev.has(n.id)?' hide':'');l.textContent=n.t||' ';
 if(n.note||(n.imgs&&n.imgs.length)){const t=document.createElement('i');t.className='nt';t.textContent='✎';l.append(t)}
 if(!leaf){const d=document.createElement('i');d.className='dot';d.textContent=col?'+'+cnt(n):'−';l.append(d)}
 e.append(l);
 if(!leaf&&!col){const k=document.createElement('div');k.className='kids';n.k.forEach(c=>k.append(build(c,rel)));e.append(k)}
 return e}
const apply=()=>W.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.k})`;
function render(){if(sel&&!find(sel))sel=null;W.replaceChildren(build(root,sel?relset():null));const mb=$('[data-a=mask]');if(mb)mb.textContent=mask?'取消遮挡':'遮挡';apply();listRender()}
function fit(){const sw=S.clientWidth,sh=S.clientHeight,w=W.offsetWidth,h=W.offsetHeight,k=Math.min(1,sw/w,sh/h);V={k,x:0,y:0};apply()}
function edit(){const r=find(sel);if(!r)return;const t=$('#dlg textarea');t.value=r.n.t;D.hidden=false;t.focus();t.select()}
$('#ok').onclick=()=>{const v=$('#dlg textarea').value;D.hidden=true;
 if(rn){const m=DB.maps.find(x=>x.id===rn),t=v.replace(/\s+/g,' ').trim();rn=null;if(m&&t){if(m===cm)mut(()=>root.t=t);else{m.root.t=t;save();listRender()}}return}
 const r=find(sel);if(r&&v!==r.n.t)mut(()=>r.n.t=v)};
$('#no').onclick=()=>{D.hidden=true;rn=null};

  else{const dx=e.clientX-m.x,dy=e.clientY-m.y;if(Math.hypot(dx,dy)>6)m.mv=true;if(m.mv){T={...T,x:m.T.x+dx,y:m.T.y+dy};ap()}}});
 const up=e=>{if(!P.delete(e.pointerId))return;
  if(!P.size){if(m&&m.m==='d'&&!m.mv){const t=Date.now();if(t-last<300){T=T.k>1.05?{x:0,y:0,k:1}:{x:0,y:0,k:2.5};ap();last=0}else last=t}m=null}

 return{reset(){T={x:0,y:0,k:1};P.clear();m=null;ap()}}}
