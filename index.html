$('#aifx').onclick=async()=>{aiRead();const a=aiD,st=$('#aies'),btn=$('#aifx');st.className='';
 if(!aiBase(a.url)){st.textContent='请先填写接口地址';return}if(!a.key){st.textContent='请先填写密钥';return}if(/[^\x20-\x7e]/.test(a.key)){st.textContent='密钥里有非英文字符，请检查是否多复制了内容';return}
 btn.disabled=true;btn.textContent='拉取中…';st.textContent='';const ab=new AbortController(),tm=setTimeout(()=>ab.abort(),20000);
 try{const r=await fetch(aiModelsUrl(a),{headers:aiHeaders(a),signal:ab.signal});
  if(!r.ok){let t='';try{t=(await r.text()).slice(0,160)}catch(e){}throw new Error('HTTP '+r.status+(t?'：'+t:''))}
  const j=await r.json(),arr=Array.isArray(j.data)?j.data:Array.isArray(j.models)?j.models:Array.isArray(j)?j:[];
  const ids=[...new Set(arr.map(x=>typeof x==='string'?x:(x&&(x.id||x.name))).filter(Boolean))].sort();
  if(!ids.length)throw new Error('接口没有返回模型列表');
  aiMods=ids;aiModOpts();st.className='ok';st.textContent='已拉取 '+ids.length+' 个模型，请选择'}
 catch(e){st.textContent=e.name==='AbortError'?'请求超时（20 秒）':e instanceof TypeError?'请求失败：地址有误、网络不通，或该服务商不允许浏览器直接访问（跨域 CORS）':'失败：'+e.message}
 finally{clearTimeout(tm);btn.disabled=false;btn.textContent='拉取模型'}};
